name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 覆盖 x64 与 arm64：Linux / Windows / macOS 各两种架构
        os:
          - ubuntu-latest      # Linux x64
          - ubuntu-24.04-arm   # Linux arm64
          - windows-latest     # Windows x64
          - windows-11-arm     # Windows arm64
          - macos-15-intel     # macOS Intel
          - macos-14           # macOS Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: 运行单元测试
        run: python -m pytest -q
      - name: 环境自检（无浏览器时应给出明确提示）
        continue-on-error: true
        run: python -m app doctor

  portable:
    name: portable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
          - macos-15-intel
          - macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: 打包（PyInstaller onedir）
        run: python -m PyInstaller --noconfirm --clean scripts/deepseek_bridge.spec
      - name: 打包冒烟测试
        continue-on-error: true
        shell: bash
        run: |
          if [ -f dist/DeepSeekBridge/DeepSeekBridge ]; then
            dist/DeepSeekBridge/DeepSeekBridge doctor
          else
            dist/DeepSeekBridge/DeepSeekBridge.exe doctor
          fi
      - name: 压缩产物
        run: python scripts/make_archive.py
      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeekBridge-${{ matrix.os }}
          path: |
            dist/DeepSeekBridge-*.zip
          if-no-files-found: error
